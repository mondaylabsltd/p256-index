[package]
name = "p256-replay"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Export register/refer calldata from one WebAuthnP256PublicKeyRegistry deployment and replay it verbatim into another (disaster migration / mainnet mirroring)"

[dependencies]
alloy = { version = "2.2.0", features = ["essentials"] }
anyhow = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
