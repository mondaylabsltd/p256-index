name: p256-index

# Runs only the HTTP/queue service. Redis and Iggy are treated as external
# dependencies: point P256_INDEX_REDIS_URL and P256_INDEX_IGGY_URL in
# ./p256-index-server/.env at them. When they run on the Docker host, use
# host.docker.internal instead of 127.0.0.1 — e.g.
#   P256_INDEX_REDIS_URL=redis://host.docker.internal:6379/0
#   P256_INDEX_IGGY_URL=iggy+tcp://iggy:pass@host.docker.internal:5100

services:
  index:
    image: ${P256_INDEX_IMAGE:-p256-index-server:local}
    build:
      # Repository root: the server is a workspace member, so its build needs
      # the sibling crates' manifests too (see p256-index-server/Dockerfile).
      context: .
      dockerfile: p256-index-server/Dockerfile
    # `.env` is gitignored, so a fresh clone does not have one: marking it
    # optional keeps `docker compose build`/`config` working there. The server
    # still needs it to run — see "Docker" in README.md
    # (cp .env.example p256-index-server/.env, then fill it in).
    env_file:
      - path: ./p256-index-server/.env
        required: false
    environment:
      PORT: 11256
    ports:
      - "${P256_INDEX_PORT:-11256}:11256"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:11256/api/health"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
