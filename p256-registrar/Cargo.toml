[package]
name = "p256-registrar"
version = "2.1.1"
edition = "2024"

# The registrar owns the service's business vocabulary and decision rules.
# It is deliberately I/O-free: no Redis, no Iggy, no HTTP clients, no runtime.
# Adding an I/O dependency here is a design violation, not a convenience.
[dependencies]
alloy = { version = "2.2.0", default-features = false, features = ["sol-types"] }
anyhow = "1"
crux_core = "0.19"
hex = "0.4"
sha2 = "0.10"
p256 = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
